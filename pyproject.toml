[project]
name = "llm-game-theory-agents"
version = "0.1.0"
description = "LLM agents in classical game-theoretic simulations (2-player), with and without workflow."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "pandas>=2.0",
  "openai>=1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
llmgt = "llmgt.cli:main"

[project.optional-dependencies]
hf = [
  "torch",
  "transformers>=4.40",
  "accelerate",
  "sentencepiece",
]
ollama = [
  "requests",
]